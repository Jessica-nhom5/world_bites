<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiểu sử: Dương Bảo Ngọc - PIXEL CLUB</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Quicksand:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --ocean-blue: #00a0b5;
            --banana: #ffef5a;
            --avocado: #98c54e;
            --bell-pepper: #14704f;
            --bubblegum: #f478b0;
            --bg-color: #e2f8ff;
            --card-bg: #ffffff;
            --text-color: #14704f;
            --border-retro: 3px solid #14704f;
            --shadow-retro: 4px 4px 0px #14704f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.7;
            padding-bottom: 40px;
        }

        /* Checkerboard Bar */
        .checkerboard-bar {
            height: 12px;
            background: repeating-linear-gradient(
                45deg,
                var(--bell-pepper),
                var(--bell-pepper) 10px,
                var(--banana) 10px,
                var(--banana) 20px
            );
            border-bottom: 2px solid var(--bell-pepper);
        }

        /* Header */
        .pixel-header {
            background-color: var(--card-bg);
            border-bottom: var(--border-retro);
            box-shadow: 0 4px 0px rgba(20, 112, 79, 0.2);
            padding: 20px;
            text-align: center;
        }

        .back-link {
            display: inline-block;
            font-family: 'Quicksand', sans-serif;
            font-size: 1rem;
            background-color: var(--banana);
            color: var(--bell-pepper);
            padding: 6px 16px;
            border: 2px solid var(--bell-pepper);
            border-radius: 6px;
            text-decoration: none;
            font-weight: 700;
            margin-bottom: 15px;
            box-shadow: 2px 2px 0px var(--bell-pepper);
            transition: transform 0.1s;
        }

        .back-link:hover {
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0px var(--bell-pepper);
            background-color: var(--avocado);
            color: #fff;
        }

        .pixel-header h1 {
            font-family: 'Quicksand', sans-serif;
            font-weight: 900;
            font-size: 1.3rem;
            color: var(--bell-pepper);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .mandatory-quote {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--ocean-blue);
            background-color: var(--banana);
            display: inline-block;
            padding: 4px 12px;
            border: 2px solid var(--bell-pepper);
            border-radius: 8px;
        }

        /* Container */
        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* Retro Window Box */
        .retro-window {
            background-color: var(--card-bg);
            border: var(--border-retro);
            box-shadow: var(--shadow-retro);
            border-radius: 12px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .retro-window-header {
            background-color: var(--ocean-blue);
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: var(--border-retro);
        }

        .window-title {
            font-family: 'VT323', monospace;
            color: #fff;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        .window-body {
            padding: 30px;
            text-align: center;
        }

        /* Profile Layout */
        .bio-avatar-wrapper {
            width: 130px;
            height: 130px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            border: 3px solid var(--bell-pepper);
            overflow: hidden;
            background-color: var(--banana);
            box-shadow: 4px 4px 0px var(--bell-pepper);
        }

        .bio-avatar-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h2.profile-name {
            font-family: 'Quicksand', sans-serif;
            font-weight: 900;
            font-size: 1.6rem;
            color: var(--bell-pepper);
            margin-bottom: 5px;
        }

        .profile-role-badge {
            display: inline-block;
            background-color: var(--bubblegum);
            color: #fff;
            font-size: 0.85rem;
            padding: 4px 14px;
            border-radius: 8px;
            border: 2px solid var(--bell-pepper);
            font-weight: 700;
            margin-bottom: 25px;
        }

        /* Info Grid */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            text-align: left;
            margin-top: 15px;
        }

        .info-item {
            background-color: #f9fefb;
            border: 2px solid var(--bell-pepper);
            padding: 12px 15px;
            border-radius: 8px;
            box-shadow: 2px 2px 0px rgba(20, 112, 79, 0.15);
        }

        .info-item strong {
            color: var(--ocean-blue);
        }

        /* Footer */
        .pixel-footer {
            text-align: center;
            margin-top: 50px;
            background-color: var(--card-bg);
            border-top: var(--border-retro);
            padding: 20px;
        }

        .pixel-footer p {
            font-size: 0.9rem;
            color: var(--bell-pepper);
            font-weight: 700;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="pixel-header">
        <div class="checkerboard-bar"></div>
        <br>
        <a href="index.html" class="back-link">⬅ Quay lại Trang chủ</a>
        <h1>HỒ SƠ CÁ NHÂN THÀNH VIÊN</h1>
