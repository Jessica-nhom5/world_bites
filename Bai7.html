<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 7: Thực hành tạo trang web đầu tiên - PIXEL CLUB</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Quicksand:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --ocean-blue: #00a0b5;
            --banana: #ffef5a;
            --avocado: #98c54e;
            --bell-pepper: #14704f;
            --bubblegum: #f478b0;
            --bg-color: #e2f8ff;
            --card-bg: #ffffff;
            --text-color: #14704f;
            --border-retro: 3px solid #14704f;
            --shadow-retro: 4px 4px 0px #14704f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.7;
            padding-bottom: 40px;
        }

        /* Checkerboard Bar */
        .checkerboard-bar {
            height: 12px;
            background: repeating-linear-gradient(
                45deg,
                var(--bell-pepper),
                var(--bell-pepper) 10px,
                var(--banana) 10px,
                var(--banana) 20px
            );
            border-bottom: 2px solid var(--bell-pepper);
        }

        /* Header */
        .pixel-header {
            background-color: var(--card-bg);
            border-bottom: var(--border-retro);
            box-shadow: 0 4px 0px rgba(20, 112, 79, 0.2);
            padding: 20px;
            text-align: center;
        }

        .back-link {
            display: inline-block;
            font-family: 'Quicksand', sans-serif;
            font-size: 1rem;
            background-color: var(--banana);
            color: var(--bell-pepper);
            padding: 6px 16px;
            border: 2px solid var(--bell-pepper);
            border-radius: 6px;
            text-decoration: none;
            font-weight: 700;
            margin-bottom: 15px;
            box-shadow: 2px 2px 0px var(--bell-pepper);
            transition: transform 0.1s;
        }

        .back-link:hover {
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0px var(--bell-pepper);
            background-color: var(--avocado);
            color: #fff;
        }

        .pixel-header h1 {
            font-family: 'Quicksand', sans-serif;
            font-weight: 900;
            font-size: 1.3rem;
            color: var(--bell-pepper);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .mandatory-quote {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--ocean-blue);
            background-color: var(--banana);
            display: inline-block;
            padding: 4px 12px;
            border: 2px solid var(--bell-pepper);
            border-radius: 8px;
        }

        /* Container */
        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* Retro Window Box */
        .retro-window {
            background-color: var(--card-bg);
            border: var(--border-retro);
            box-shadow: var(--shadow-retro);
            border-radius: 12px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .retro-window-header {
            background-color: var(--ocean-blue);
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: var(--border-retro);
        }

        .window-title {
            font-family: 'VT323', monospace;
            color: #fff;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        .window-body {
            padding: 25px;
        }

            font-family: 'Quicksand', sans-serif;
            font-weight: 900;
            font-size: 1.3rem;
